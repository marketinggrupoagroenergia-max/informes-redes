name: Extraer métricas de Meta

on:
  schedule:
    # Día 2 de cada mes, 00:17 hora Argentina (03:17 UTC). GitHub suele demorar
    # los horarios programados varias horas; los informes salen ~9:50, así que
    # se adelanta para dejar margen. Si igual no llegó, el informe dispara la
    # extracción a mano (ver INFORME_MENSUAL.md).
    - cron: "17 3 2 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes puntual (AAAA-MM). Vacío = mes anterior"
        required: false
      historico:
        description: "Cantidad de meses hacia atrás (ej. 24). Vacío = solo uno"
        required: false

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extraer métricas
        env:
          META_TOKEN_HAVANNA: ${{ secrets.META_TOKEN_HAVANNA }}
          META_TOKEN_DYNAMIS: ${{ secrets.META_TOKEN_DYNAMIS }}
          META_TOKEN_AGROENERGIA: ${{ secrets.META_TOKEN_AGROENERGIA }}
          META_TOKEN_AGROENERGIA_IG: ${{ secrets.META_TOKEN_AGROENERGIA_IG }}
          MES: ${{ github.event.inputs.mes }}
          HISTORICO: ${{ github.event.inputs.historico }}
        run: |
          ARGS=""
          if [ -n "$MES" ]; then ARGS="--mes $MES"; fi
          if [ -n "$HISTORICO" ]; then ARGS="--historico $HISTORICO"; fi
          python scripts/extraer_metricas.py $ARGS
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "informes-bot"
          git config user.email "informes-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Métricas $(date -u +%Y-%m-%d)"
          git push
